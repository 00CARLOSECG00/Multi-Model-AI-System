services:
  notebook:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - "./work:/home/jovyan/work"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: ""
      JUPYTER_PASSWORD: ""
    command:
      - "start-notebook.py"
      - "--IdentityProvider.token="
      - "--ServerApp.password="
